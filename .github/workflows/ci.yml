name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend-admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: zentrix, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: zentrix }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zentrix" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://zentrix:ci_only@localhost:5432/zentrix?schema=public
      TEST_DATABASE_URL: postgresql://zentrix:ci_only@localhost:5432/zentrix?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @zentrix/database migrate:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
