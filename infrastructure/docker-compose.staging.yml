# Staging stack. Nothing here publishes a database port; only the admin portal is reachable from outside.
#   cp infrastructure/staging.env.example infrastructure/.env.staging   # then fill in every value
#   docker compose -f infrastructure/docker-compose.staging.yml --env-file infrastructure/.env.staging up -d --build
name: ${COMPOSE_PROJECT_NAME:-zentrix-staging}

x-backend-env: &backend-env
  APP_ENV: staging
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?set INTERNAL_JOB_TOKEN}
  API_CORS_ORIGINS: ${PUBLIC_ADMIN_ORIGIN:-http://localhost:8080}
  ALLOW_SETUP_TOKEN_IN_RESPONSE: ${ALLOW_SETUP_TOKEN_IN_RESPONSE:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: applies migrations and seeds the RBAC catalogue, products and branches (no demo users outside development).
  migrate:
    build: { context: .., dockerfile: infrastructure/docker/backend.Dockerfile }
    image: zentrix-backend:staging
    environment: *backend-env
    working_dir: /app/database
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && cd ../services/api && node dist/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: zentrix-backend:staging
    restart: unless-stopped
    environment:
      <<: *backend-env
      API_PORT: "3000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: zentrix-backend:staging
    restart: unless-stopped
    working_dir: /app/services/worker
    command: ["node", "dist/main.js"]
    environment:
      <<: *backend-env
      API_BASE_URL: http://api:3000
      PUSH_WEBHOOK_URL: ${PUSH_WEBHOOK_URL:-}
      PUSH_WEBHOOK_TOKEN: ${PUSH_WEBHOOK_TOKEN:-}
    depends_on:
      api: { condition: service_healthy }

  admin:
    build: { context: .., dockerfile: infrastructure/docker/admin.Dockerfile }
    image: zentrix-admin:staging
    restart: unless-stopped
    ports: ["${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
